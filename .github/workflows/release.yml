name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # push the release image to ghcr.io/ebuildy/cigar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog

      - uses: jdx/mise-action@v2

      # QEMU isn't strictly needed today (Dockerfile.goreleaser only COPYs a
      # pre-built binary, no RUN steps to emulate) but is the standard,
      # low-cost setup for a buildx multi-arch job — keeps arm64 builds
      # working if the Dockerfile ever grows a build step.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        run: mise exec -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
