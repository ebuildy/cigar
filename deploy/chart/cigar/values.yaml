# Default values for cigar.

# Two replicas + PodDisruptionBudget: survive node drains.
replicaCount: 1

image:
  repository: ghcr.io/ebuildy/cigar
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Bot configuration. Rendered into a ConfigMap as /etc/cigar/config.yaml.
# Every key maps to an env var (GROUP_KEY) and a CLI flag (--group-key); the
# file is the source, env/flags override. Secrets are NOT here — see secrets.*.
config:
  gitlab:
    url: "https://gitlab.com"
  prometheus:
    # Must scrape cadvisor and kube-state-metrics.
    url: "http://prometheus-operated.monitoring.svc:9090"
    scrapeInterval: "30s"
  # Pod-correlation strategy: "trace" or "prometheus".
  podResolver: "trace"
  webhook:
    # Webhook auth method: "secret" (X-Gitlab-Token, needs secrets.webhookSecret)
    # or "signing_token" (webhook-signature HMAC, needs secrets.signingToken).
    authMethod: "secret"
  report:
    throttleWarnRatio: "0.25"
    longJobDuration: "10m"
    memoryPressureRatio: "0.9"
  commands:
    # Interactive report commands. Requires secrets.commandsSigningKey when true.
    enabled: false
    chartFormat: "png"
  server:
    listenAddr: ":8080"
    opsAddr: ":8081"
  log:
    level: "info"

secrets:
  # Name of an existing Secret holding GITLAB_TOKEN plus the key the configured
  # config.webhook.authMethod needs (WEBHOOK_SECRET for "secret",
  # WEBHOOK_SIGNING_TOKEN for "signing_token"), plus COMMANDS_SIGNING_KEY when
  # commands.enabled is true. Recommended (sealed-secrets, external-secrets, ...).
  existingSecret: ""
  # Alternatively set the values here and the chart creates the Secret
  # itself. Avoid committing real values to git.
  webhookSecret: ""
  # WEBHOOK_SIGNING_TOKEN: GitLab signing token (whsec_...). Required only when
  # config.webhook.authMethod is "signing_token". Prefer existingSecret in production.
  signingToken: ""
  gitlabToken: ""
  # COMMANDS_SIGNING_KEY: HMAC key signing the report marker for interactive
  # commands. Required only when commands.enabled is true; must be a stable
  # random secret shared by every replica. Prefer existingSecret in production.
  commandsSigningKey: ""

# Extra environment variables for the bot container.
extraEnv: []
#  - name: LISTEN_ADDR
#    value: ":8080"

# Static /etc/hosts entries for the pod. Not needed against a normal
# GitLab instance with real DNS; useful for environments (e.g. some local
# dev clusters) where a hostname resolves differently — or not at all —
# inside the cluster than it does wherever config.gitlabUrl's host is
# otherwise expected to resolve.
#  - ip: "10.96.194.60"
#    hostnames:
#      - gitlab.kind.local
hostAliases: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # The bot talks only to GitLab and Prometheus — no Kubernetes API access.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Distroless nonroot user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Webhook port.
  port: 8080
  # Health + metrics port.
  opsPort: 8081

# PodMonitor for the Prometheus Operator, scraping the cigar_ ops metrics from
# the ops port (/metrics). Disabled by default so the chart does not require the
# monitoring.coreos.com CRDs to be installed.
podMonitor:
  enabled: false
  # Namespace for the PodMonitor (defaults to the release namespace).
  namespace: ""
  # Extra labels — e.g. the label your Prometheus Operator selects on
  # (commonly `release: kube-prometheus-stack`).
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  # relabel_configs applied before scraping.
  relabelings: []
  # metric_relabel_configs applied after scraping.
  metricRelabelings: []

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: cigar.example.com
      paths:
        - path: /webhook
          pathType: Prefix
  tls: []
    # - secretName: cigar-tls
    #   hosts:
    #     - cigar.example.com

# Expose the service via gateway-api HTTPRoute instead of Ingress.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - cigar.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook

# Practice what we preach.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: ops
readinessProbe:
  httpGet:
    path: /readyz
    port: ops

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Sources allowed to reach the webhook (8080) and ops (8081) ports,
  # e.g. your ingress controller and Prometheus (for /metrics scrapes).
  # Empty list = any source.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # Egress to GitLab over HTTPS. gitlab.com has no stable CIDR, hence the
  # default; tighten it for a self-hosted instance.
  gitlab:
    cidr: 0.0.0.0/0
    port: 443
  # Egress to the in-cluster Prometheus (must match config.prometheusUrl).
  prometheus:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
    port: 9090
  # Additional egress rules (raw NetworkPolicy egress entries).
  extraEgress: []

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
