# Default values for cigar.

# Two replicas + PodDisruptionBudget: survive node drains.
replicaCount: 1

image:
  repository: ghcr.io/ebuildy/cigar
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Bot configuration. Rendered into a ConfigMap as /etc/cigar/config.yaml.
# Every key maps to an env var (GROUP_KEY) and a CLI flag (--group-key); the
# file is the source, env/flags override. Secrets are NOT here — see secrets.*.
config:
  gitlab:
    url: "https://gitlab.com"
  prometheus:
    # Must scrape cadvisor and kube-state-metrics.
    url: "http://prometheus-operated.monitoring.svc:9090"
    scrapeInterval: "30s"
  # Pod-correlation strategy: "trace" or "prometheus".
  podResolver: "trace"
  webhook:
    # Webhook auth method: "secret" (X-Gitlab-Token, needs
    # secrets.WEBHOOK_SECRET) or "signing_token" (webhook-signature HMAC, needs
    # secrets.WEBHOOK_SIGNING_TOKEN).
    authMethod: "secret"
  report:
    throttleWarnRatio: "0.25"
    longJobDuration: "10m"
    memoryPressureRatio: "0.9"
  commands:
    # Interactive report commands. Requires secrets.COMMANDS_SIGNING_KEY when
    # true.
    enabled: false
    chartFormat: "png"
  server:
    listenAddr: ":8080"
    opsAddr: ":8081"
  log:
    level: "info"

# ESO generators to create, keyed by the resource name. The name is used as-is
# (not release-prefixed), so it is exactly what an `externalSecrets` spec below
# references under `sourceRef.generatorRef.name`. ClusterGenerator is
# cluster-scoped — pick names that stay unique across releases.
#
# Shorthand: the entry is the `passwordSpec` of a Password ClusterGenerator, so
# one generator can mint several independent values at once via `secretKeys`.
# For any other generator kind, set `kind` and a raw `spec` instead:
#   myToken:
#     kind: ClusterGenerator
#     spec:
#       kind: UUID
#       generator: {uuidSpec: {}}
externalSecretsGenerator: {}
  # keys:
  #   # 32 raw characters, so the whsec_ template below b64encs it into the
  #   # 32-byte key GitLab requires. Do not set `encoding` as well.
  #   length: 32
  #   digits: 8
  #   # No symbols: these travel through env vars, keep them quoting-safe.
  #   symbols: 0
  #   # One independent random value per key.
  #   secretKeys:
  #     - WEBHOOK_SECRET
  #     - WEBHOOK_SIGNING_TOKEN
  #     - COMMANDS_SIGNING_KEY

# ExternalSecret instances, keyed by a name of your choosing. The value is the
# raw `spec` of an External Secrets Operator ExternalSecret, rendered verbatim —
# so anything ESO supports works here (stores, generators, dataFrom, templates,
# rewrites) without the chart modelling it.
#
# The chart names each CR `<release>-<key>`, and ESO defaults the Secret it
# manages to that same name. So the entry below produces Secret `cigar-vault`,
# which `secrets.GITLAB_TOKEN.externalSecret: vault` reads from.
externalSecrets: {}
  # vault:
  #   refreshInterval: "1h"
  #   secretStoreRef:
  #     name: vault
  #     kind: ClusterSecretStore
  #   data:
  #     - secretKey: GITLAB_TOKEN
  #       remoteRef:
  #         key: cigar/gitlab
  #         property: token
  #
  # keys:
  #   # A generator mints NEW values on every refresh; "0s" fetches once, so
  #   # anything GitLab also holds a copy of stays stable.
  #   refreshInterval: "0s"
  #   # dataFrom pulls every key the generator emits (see its `secretKeys`).
  #   dataFrom:
  #     - sourceRef:
  #         generatorRef:
  #           apiVersion: generators.external-secrets.io/v1alpha1
  #           kind: ClusterGenerator
  #           name: keys
  #   target:
  #     template:
  #       engineVersion: v2
  #       # Required when only some keys are templated: ESO's default (Replace)
  #       # keeps ONLY templated keys and drops the rest.
  #       mergePolicy: Merge
  #       data:
  #         # A generator emits a bare random string, but GitLab signing tokens
  #         # are whsec_<standard base64 of a 32-byte key> — so b64enc the
  #         # generated value (32 raw chars) and prepend the prefix.
  #         WEBHOOK_SIGNING_TOKEN: "whsec_{{ .WEBHOOK_SIGNING_TOKEN | b64enc }}"

# apiVersion for the ExternalSecrets above. ESO >= 0.11 serves
# external-secrets.io/v1; set external-secrets.io/v1beta1 for older operators.
externalSecretApiVersion: external-secrets.io/v1

# Secrets the bot consumes, keyed by the environment variable name. Each is
# sourced independently, so the GitLab token can live in a Secret your platform
# team owns while the HMAC keys come from somewhere else entirely.
#
# Set exactly ONE source per secret:
#   value           raw literal; the chart puts it in a Secret it owns (fine for
#                   a scratch cluster, it lands in your Helm release — don't
#                   commit real ones)
#   existingSecret  name of a Secret you already manage (sealed-secrets, SOPS,
#                   a script, an ExternalSecret of your own)
#   externalSecret  name of an `externalSecrets` entry above; reads the Secret
#                   that ExternalSecret manages
#
# Only the secrets the current config actually needs are rendered and injected:
# GITLAB_TOKEN always, WEBHOOK_SECRET or WEBHOOK_SIGNING_TOKEN depending on
# config.webhook.authMethod, COMMANDS_SIGNING_KEY when config.commands.enabled.
# A required secret with no source fails the render.
secrets:
  # Project/group access token with `api` scope. Cannot be generated — a random
  # value authenticates nothing — so back it with a real store or Secret.
  GITLAB_TOKEN:
    value: ""
    existingSecret: ""
    # Key to read inside the Secret. Defaults to the secret's own name
    # (GITLAB_TOKEN); set it only when the Secret spells it differently.
    key: ""
    externalSecret: ""

  # Legacy shared secret, compared against the X-Gitlab-Token header. Needed
  # when config.webhook.authMethod is "secret".
  WEBHOOK_SECRET:
    value: ""
    existingSecret: ""
    key: ""
    externalSecret: ""

  # GitLab signing token, verifying the webhook-signature HMAC. Needed when
  # config.webhook.authMethod is "signing_token". Must be whsec_<base64>
  # encoding a 32-byte key — `echo "whsec_$(openssl rand -base64 32)"` — and
  # identical to the signing_token on every project hook. The chart checks that
  # shape for a literal `value`; behind an existingSecret or ExternalSecret it
  # is on you (see the `keys` example above for generating a valid one).
  WEBHOOK_SIGNING_TOKEN:
    value: ""
    existingSecret: ""
    key: ""
    externalSecret: ""

  # HMAC key signing the report marker for interactive commands. Needed when
  # config.commands.enabled is true. The best generator candidate: it only has
  # to be stable and shared by every replica, and never leaves the cluster.
  COMMANDS_SIGNING_KEY:
    value: ""
    existingSecret: ""
    key: ""
    externalSecret: ""

# Extra environment variables for the bot container.
extraEnv: []
#  - name: LISTEN_ADDR
#    value: ":8080"

# Static /etc/hosts entries for the pod. Not needed against a normal
# GitLab instance with real DNS; useful for environments (e.g. some local
# dev clusters) where a hostname resolves differently — or not at all —
# inside the cluster than it does wherever config.gitlabUrl's host is
# otherwise expected to resolve.
#  - ip: "10.96.194.60"
#    hostnames:
#      - gitlab.kind.local
hostAliases: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # The bot talks only to GitLab and Prometheus — no Kubernetes API access.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Distroless nonroot user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Webhook port.
  port: 8080
  # Health + metrics port.
  opsPort: 8081

# PodMonitor for the Prometheus Operator, scraping the cigar_ ops metrics from
# the ops port (/metrics). Disabled by default so the chart does not require the
# monitoring.coreos.com CRDs to be installed.
podMonitor:
  enabled: false
  # Namespace for the PodMonitor (defaults to the release namespace).
  namespace: ""
  # Extra labels — e.g. the label your Prometheus Operator selects on
  # (commonly `release: kube-prometheus-stack`).
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  # relabel_configs applied before scraping.
  relabelings: []
  # metric_relabel_configs applied after scraping.
  metricRelabelings: []

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: cigar.example.com
      paths:
        - path: /webhook
          pathType: Prefix
  tls: []
    # - secretName: cigar-tls
    #   hosts:
    #     - cigar.example.com

# Expose the service via gateway-api HTTPRoute instead of Ingress.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - cigar.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook

# Practice what we preach.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: ops
readinessProbe:
  httpGet:
    path: /readyz
    port: ops

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Sources allowed to reach the webhook (8080) and ops (8081) ports,
  # e.g. your ingress controller and Prometheus (for /metrics scrapes).
  # Empty list = any source.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # Egress to GitLab over HTTPS. gitlab.com has no stable CIDR, hence the
  # default; tighten it for a self-hosted instance.
  gitlab:
    cidr: 0.0.0.0/0
    port: 443
  # Egress to the in-cluster Prometheus (must match config.prometheusUrl).
  prometheus:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
    port: 9090
  # Additional egress rules (raw NetworkPolicy egress entries).
  extraEgress: []

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
