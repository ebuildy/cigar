suite: secrets
templates:
  - secret.yaml
  - externalsecret.yaml
  - externalsecret-generator.yaml
  - deployment.yaml
  # Not asserted on, but deployment.yaml's checksum/config annotation includes
  # it, so it has to be in the suite's template scope.
  - configmap.yaml
tests:
  # --- literal values -------------------------------------------------------
  - it: puts literal values in a Secret the chart owns
    template: secret.yaml
    set:
      secrets.GITLAB_TOKEN.value: glpat-x
      secrets.WEBHOOK_SECRET.value: wh
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cigar
      - equal:
          path: stringData
          value:
            GITLAB_TOKEN: glpat-x
            WEBHOOK_SECRET: wh

  - it: leaves out secrets the current config does not require
    template: secret.yaml
    set:
      config.webhook.authMethod: signing_token
      secrets.GITLAB_TOKEN.value: glpat-x
      # Configured but unused: authMethod is signing_token, and commands are off.
      secrets.WEBHOOK_SECRET.value: unused
      secrets.COMMANDS_SIGNING_KEY.value: unused
      secrets.WEBHOOK_SIGNING_TOKEN.value: whsec_ZuaImjLinOp9o9OBSkNkHUO3vxdglJgGqhmibDg9Vek=
    asserts:
      - equal:
          path: stringData
          value:
            GITLAB_TOKEN: glpat-x
            WEBHOOK_SIGNING_TOKEN: whsec_ZuaImjLinOp9o9OBSkNkHUO3vxdglJgGqhmibDg9Vek=

  - it: renders no Secret when nothing is a literal
    template: secret.yaml
    set:
      secrets.GITLAB_TOKEN.existingSecret: gitlab-creds
      secrets.WEBHOOK_SECRET.existingSecret: webhook-creds
    asserts:
      - hasDocuments:
          count: 0

  # --- per-secret sourcing --------------------------------------------------
  - it: reads each secret from its own Secret object
    template: deployment.yaml
    set:
      config.webhook.authMethod: signing_token
      config.commands.enabled: true
      secrets.GITLAB_TOKEN.existingSecret: gitlab-creds
      secrets.GITLAB_TOKEN.key: token
      externalSecrets.keys.refreshInterval: 0s
      secrets.WEBHOOK_SIGNING_TOKEN.externalSecret: keys
      secrets.COMMANDS_SIGNING_KEY.value: deadbeef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            # A Secret the user manages, under a key of their choosing.
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-creds
                  key: token
            # The Secret an ExternalSecret manages.
            - name: WEBHOOK_SIGNING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: RELEASE-NAME-cigar-keys
                  key: WEBHOOK_SIGNING_TOKEN
            # The one the chart owns, for literals.
            - name: COMMANDS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: RELEASE-NAME-cigar
                  key: COMMANDS_SIGNING_KEY

  - it: defaults the existing-Secret key to the secret's own name
    template: deployment.yaml
    set:
      secrets.GITLAB_TOKEN.existingSecret: cigar-secrets
      secrets.WEBHOOK_SECRET.existingSecret: cigar-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: cigar-secrets
                key: GITLAB_TOKEN

  - it: injects WEBHOOK_SECRET for the default auth method
    template: deployment.yaml
    set:
      secrets.GITLAB_TOKEN.value: glpat-x
      secrets.WEBHOOK_SECRET.value: wh
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cigar
                key: WEBHOOK_SECRET
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_SIGNING_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cigar
                key: WEBHOOK_SIGNING_TOKEN

  - it: swaps to WEBHOOK_SIGNING_TOKEN for the signing_token auth method
    template: deployment.yaml
    set:
      config.webhook.authMethod: signing_token
      secrets.GITLAB_TOKEN.value: glpat-x
      secrets.WEBHOOK_SIGNING_TOKEN.value: whsec_ZuaImjLinOp9o9OBSkNkHUO3vxdglJgGqhmibDg9Vek=
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_SIGNING_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cigar
                key: WEBHOOK_SIGNING_TOKEN
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cigar
                key: WEBHOOK_SECRET

  - it: adds COMMANDS_SIGNING_KEY only when commands are enabled
    template: deployment.yaml
    set:
      config.commands.enabled: true
      secrets.GITLAB_TOKEN.value: glpat-x
      secrets.WEBHOOK_SECRET.value: wh
      secrets.COMMANDS_SIGNING_KEY.value: deadbeef
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMMANDS_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cigar
                key: COMMANDS_SIGNING_KEY

  # --- ExternalSecret -------------------------------------------------------
  - it: refuses a required secret with no source
    # The fail() is attributed to the first template Helm evaluates.
    template: secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "secrets.GITLAB_TOKEN needs a source: set value, existingSecret, or externalSecret — the current configuration requires GITLAB_TOKEN"

  - it: refuses a secret with more than one source
    # The fail() is attributed to the first template Helm evaluates.
    template: secret.yaml
    set:
      secrets.GITLAB_TOKEN.value: glpat-x
      secrets.GITLAB_TOKEN.existingSecret: gitlab-creds
    asserts:
      - failedTemplate:
          errorMessage: "secrets.GITLAB_TOKEN has more than one source (value, existingSecret): set exactly one"

  - it: refuses an unknown secret name
    # The fail() is attributed to the first template Helm evaluates.
    template: secret.yaml
    set:
      secrets.GITLAB_TOKEN.value: glpat-x
      secrets.WEBHOOK_SECRET.value: wh
      secrets.GITLAB_TOEKN.value: typo
    asserts:
      - failedTemplate:
          errorMessage: "secrets.GITLAB_TOEKN is not a secret this chart knows — expected one of: GITLAB_TOKEN, WEBHOOK_SECRET, WEBHOOK_SIGNING_TOKEN, COMMANDS_SIGNING_KEY"

  - it: accepts a well-formed literal signing token
    template: secret.yaml
    set:
      config.webhook.authMethod: signing_token
      secrets.GITLAB_TOKEN.existingSecret: gitlab-creds
      secrets.WEBHOOK_SIGNING_TOKEN.value: whsec_ZuaImjLinOp9o9OBSkNkHUO3vxdglJgGqhmibDg9Vek=
    asserts:
      - equal:
          path: stringData.WEBHOOK_SIGNING_TOKEN
          value: whsec_ZuaImjLinOp9o9OBSkNkHUO3vxdglJgGqhmibDg9Vek=

  - it: refuses a literal signing token that is not whsec_-prefixed
    # The fail() is attributed to the first template Helm evaluates.
    template: secret.yaml
    set:
      config.webhook.authMethod: signing_token
      secrets.GITLAB_TOKEN.existingSecret: gitlab-creds
      secrets.WEBHOOK_SIGNING_TOKEN.value: ZuaImjLinOp9o9OBSkNkHUO3vxdglJgGqhmibDg9Vek=
    asserts:
      - failedTemplate:
          errorMessage: 'secrets.WEBHOOK_SIGNING_TOKEN.value must be whsec_<base64> encoding a 32-byte key — generate one with: echo "whsec_$(openssl rand -base64 32)"'

  - it: refuses a literal signing token whose key is not 32 bytes
    # The fail() is attributed to the first template Helm evaluates.
    template: secret.yaml
    set:
      config.webhook.authMethod: signing_token
      secrets.GITLAB_TOKEN.existingSecret: gitlab-creds
      # base64 of a 16-byte key — decodes fine, but is half the required size.
      secrets.WEBHOOK_SIGNING_TOKEN.value: whsec_MDEyMzQ1Njc4OWFiY2RlZg==
    asserts:
      - failedTemplate:
          errorMessage: 'secrets.WEBHOOK_SIGNING_TOKEN.value must be whsec_<base64> encoding a 32-byte key — generate one with: echo "whsec_$(openssl rand -base64 32)"'
