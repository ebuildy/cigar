{{- include "cigar.validateSecrets" . }}
{{- /* Only the required secrets given as a literal `value` land here; the rest
       come from a Secret the user manages or one ESO materialises. */}}
{{- $literals := dict }}
{{- range $name := splitList " " (include "cigar.requiredSecretNames" .) }}
{{- $s := get $.Values.secrets $name | default dict }}
{{- if and $s.value (not $s.existingSecret) }}
{{- $_ := set $literals $name $s.value }}
{{- end }}
{{- end }}
{{- if $literals }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cigar.fullname" . }}
  labels:
    {{- include "cigar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := $literals }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
