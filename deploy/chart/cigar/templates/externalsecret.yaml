{{- include "cigar.validateSecrets" . }}
{{- /* Each entry is a raw ExternalSecret spec, rendered verbatim. ESO defaults
       the managed Secret's name to the ExternalSecret's own, so entry `vault`
       produces Secret `<fullname>-vault` — which is what
       secrets.<NAME>.externalSecret: vault points the Deployment at. Set
       spec.target.name yourself only if you want a different one. */}}
{{- range $ref, $spec := .Values.externalSecrets | default dict }}
---
apiVersion: {{ $.Values.externalSecretApiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ include "cigar.externalSecretName" (dict "root" $ "ref" $ref) }}
  labels:
    {{- include "cigar.labels" $ | nindent 4 }}
spec:
  {{- $spec | toYaml | nindent 2 }}
{{- end }}
