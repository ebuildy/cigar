{{- /* ESO generators. An entry is either a raw `spec` (any generator kind) or,
       as shorthand, the passwordSpec of a Password generator — which is the
       common case here, since one Password generator can mint an independent
       value per `secretKeys` entry. Names are used verbatim so they match the
       sourceRef.generatorRef.name in your externalSecrets specs. */}}
{{- range $name, $gen := .Values.externalSecretsGenerator | default dict }}
---
apiVersion: {{ $gen.apiVersion | default "generators.external-secrets.io/v1alpha1" }}
kind: {{ $gen.kind | default "ClusterGenerator" }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "cigar.labels" $ | nindent 4 }}
spec:
  {{- if $gen.spec }}
  {{- $gen.spec | toYaml | nindent 2 }}
  {{- else }}
  kind: Password
  generator:
    passwordSpec:
      {{- /* allowRepeat/length/noUpper are required by the CRD; default the two
             that have no sensible reason to be spelled out every time. */}}
      allowRepeat: {{ $gen.allowRepeat | default true }}
      noUpper: {{ $gen.noUpper | default false }}
      {{- omit $gen "apiVersion" "kind" "spec" "allowRepeat" "noUpper" | toYaml | nindent 6 }}
  {{- end }}
{{- end }}
